services:
  db:
    image: mysql:8.0
    container_name: brickscore-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: brickscore
      MYSQL_USER: brickuser
      MYSQL_PASSWORD: brickpass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - brickscore-network
    healthcheck: # ← 추가!
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "brickuser", "-pbrickpass" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: brickscore-app
    depends_on:
      db:
        condition: service_healthy  # ← 수정! DB가 healthy될 때까지 대기
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/brickscore
      SPRING_DATASOURCE_USERNAME: brickuser
      SPRING_DATASOURCE_PASSWORD: brickpass
    ports:
      - "8080:8080"
    networks:
      - brickscore-network

networks:
  brickscore-network:
    driver: bridge

volumes:
  mysql-data: