version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: brickscore-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: brickscore
      MYSQL_USER: brickuser
      MYSQL_PASSWORD: brickpass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - brickscore-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "brickuser", "-pbrickpass"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:  # ← 새로 추가!
    image: redis:7-alpine
    container_name: brickscore-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes  # 데이터 영속성
    volumes:
      - redis-data:/data  # Redis 데이터 저장
    networks:
      - brickscore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: brickscore-app
    depends_on:
      db:
        condition: service_healthy
      redis:  # ← 추가!
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/brickscore
      SPRING_DATASOURCE_USERNAME: brickuser
      SPRING_DATASOURCE_PASSWORD: brickpass
      SPRING_REDIS_HOST: redis  # ← 추가!
      SPRING_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    networks:
      - brickscore-network

networks:
  brickscore-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:  # ← 추가!