# ?????? ??
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/brickscore}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:brickuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:brickpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Redis ?? ??
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# ?? ??
spring.cache.type=redis
spring.cache.redis.time-to-live=600000  # 10?

# ??
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ?? ??
server.port=8080