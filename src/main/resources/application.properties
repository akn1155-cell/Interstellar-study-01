spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/brickscore}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:brickuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:brickpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ??
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

